name: Build Launchers

on:
  push:
    tags: [ "V_*" ]   # only version tags build; they also publish a GitHub Release
  workflow_dispatch:  # manual run from the Actions tab (builds, no release)

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: .exe
            platform: Windows

          # Linux disabled while testing on Windows - uncomment to build it again
          # - os: ubuntu-latest
          #   ext: ''
          #   platform: Linux

          # macOS disabled - uncomment to build it again
          # - os: macos-latest
          #   ext: ''
          #   platform: MacOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Linux specific: SDL2 headers, Tk, and a current SDL3 built from source
    - name: Install SDL2 and SDL3 (Linux Only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev cmake build-essential python3-tk
        git clone https://github.com/libsdl-org/SDL.git --branch release-3.2.14 --depth 1
        cd SDL && cmake -B build -DSDL_SHARED=ON -DSDL_STATIC=OFF
        cmake --build build --parallel
        sudo cmake --install build

    - name: Build with build.bat (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        call .\build.bat Ryujinx
        if errorlevel 1 exit /b 1
        call .\build.bat Eden
        if errorlevel 1 exit /b 1
        call .\build.bat Nextendo
        if errorlevel 1 exit /b 1
        call .\build.bat Citron
        if errorlevel 1 exit /b 1
        call .\build.bat CitronNextendo
        if errorlevel 1 exit /b 1
        call .\build.bat Azahar
        if errorlevel 1 exit /b 1
        call .\build.bat PCSX2
        if errorlevel 1 exit /b 1
        call .\build.bat DuckStation
        if errorlevel 1 exit /b 1
        call .\build.bat Xemu
        if errorlevel 1 exit /b 1
        call .\build.bat MelonDS
        if errorlevel 1 exit /b 1
        call .\build.bat Cemu
        if errorlevel 1 exit /b 1
        call .\build.bat Mesen
        if errorlevel 1 exit /b 1
        call .\build.bat Gopher64
        if errorlevel 1 exit /b 1
        call .\build.bat MGBA
        if errorlevel 1 exit /b 1
        call .\build.bat PPSSPP
        if errorlevel 1 exit /b 1
        call .\build.bat RetroArch
        if errorlevel 1 exit /b 1
        call .\build.bat Dolphin
        if errorlevel 1 exit /b 1
        call .\build.bat BizHawk
        if errorlevel 1 exit /b 1
        call .\build.bat Yuzu
        if errorlevel 1 exit /b 1

    # build.sh chmods the produced binary itself, so GitHub preserves the
    # executable bit when it zips the artifact
    - name: Build with build.sh (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        ./build.sh Ryujinx
        ./build.sh Eden
        ./build.sh Nextendo
        ./build.sh Citron
        ./build.sh CitronNextendo
        ./build.sh Azahar
        ./build.sh PCSX2
        ./build.sh DuckStation
        ./build.sh Xemu
        ./build.sh MelonDS
        ./build.sh Cemu
        ./build.sh Mesen
        ./build.sh Gopher64
        ./build.sh MGBA
        ./build.sh PPSSPP
        ./build.sh RetroArch
        ./build.sh Dolphin
        ./build.sh BizHawk
        ./build.sh Yuzu

    # Upload the Raw Binaries
    # GitHub Actions will automatically ZIP each into '<name>.zip'
    - name: Upload Ryujinx Launcher
      uses: actions/upload-artifact@v4
      with:
        name: RyujinxLauncher-${{ matrix.platform }}
        path: dist/RyujinxLauncher${{ matrix.ext }}

    - name: Upload Eden Launcher
      uses: actions/upload-artifact@v4
      with:
        name: EdenLauncher-${{ matrix.platform }}
        path: dist/EdenLauncher${{ matrix.ext }}

    - name: Upload Nextendo Launcher
      uses: actions/upload-artifact@v4
      with:
        name: NextendoLauncher-${{ matrix.platform }}
        path: dist/NextendoLauncher${{ matrix.ext }}

    - name: Upload Citron Launcher
      uses: actions/upload-artifact@v4
      with:
        name: CitronLauncher-${{ matrix.platform }}
        path: dist/CitronLauncher${{ matrix.ext }}

    - name: Upload CitronNextendo Launcher
      uses: actions/upload-artifact@v4
      with:
        name: CitronNextendoLauncher-${{ matrix.platform }}
        path: dist/CitronNextendoLauncher${{ matrix.ext }}

    - name: Upload Azahar Launcher
      uses: actions/upload-artifact@v4
      with:
        name: AzaharLauncher-${{ matrix.platform }}
        path: dist/AzaharLauncher${{ matrix.ext }}

    - name: Upload PCSX2 Launcher
      uses: actions/upload-artifact@v4
      with:
        name: PCSX2Launcher-${{ matrix.platform }}
        path: dist/PCSX2Launcher${{ matrix.ext }}

    - name: Upload DuckStation Launcher
      uses: actions/upload-artifact@v4
      with:
        name: DuckStationLauncher-${{ matrix.platform }}
        path: dist/DuckStationLauncher${{ matrix.ext }}

    - name: Upload Xemu Launcher
      uses: actions/upload-artifact@v4
      with:
        name: XemuLauncher-${{ matrix.platform }}
        path: dist/XemuLauncher${{ matrix.ext }}

    - name: Upload MelonDS Launcher
      uses: actions/upload-artifact@v4
      with:
        name: MelonDSLauncher-${{ matrix.platform }}
        path: dist/MelonDSLauncher${{ matrix.ext }}

    - name: Upload Cemu Launcher
      uses: actions/upload-artifact@v4
      with:
        name: CemuLauncher-${{ matrix.platform }}
        path: dist/CemuLauncher${{ matrix.ext }}

    - name: Upload Mesen Launcher
      uses: actions/upload-artifact@v4
      with:
        name: MesenLauncher-${{ matrix.platform }}
        path: dist/MesenLauncher${{ matrix.ext }}

    - name: Upload Gopher64 Launcher
      uses: actions/upload-artifact@v4
      with:
        name: Gopher64Launcher-${{ matrix.platform }}
        path: dist/Gopher64Launcher${{ matrix.ext }}

    - name: Upload MGBA Launcher
      uses: actions/upload-artifact@v4
      with:
        name: MGBALauncher-${{ matrix.platform }}
        path: dist/MGBALauncher${{ matrix.ext }}

    - name: Upload PPSSPP Launcher
      uses: actions/upload-artifact@v4
      with:
        name: PPSSPPLauncher-${{ matrix.platform }}
        path: dist/PPSSPPLauncher${{ matrix.ext }}

    - name: Upload RetroArch Launcher
      uses: actions/upload-artifact@v4
      with:
        name: RetroArchLauncher-${{ matrix.platform }}
        path: dist/RetroArchLauncher${{ matrix.ext }}

    - name: Upload Dolphin Launcher
      uses: actions/upload-artifact@v4
      with:
        name: DolphinLauncher-${{ matrix.platform }}
        path: dist/DolphinLauncher${{ matrix.ext }}

    - name: Upload BizHawk Launcher
      uses: actions/upload-artifact@v4
      with:
        name: BizHawkLauncher-${{ matrix.platform }}
        path: dist/BizHawkLauncher${{ matrix.ext }}

    - name: Upload Yuzu Launcher
      uses: actions/upload-artifact@v4
      with:
        name: YuzuLauncher-${{ matrix.platform }}
        path: dist/YuzuLauncher${{ matrix.ext }}

  # Runs only for version tags (e.g. V_1_3_0): collects every build artifact
  # and publishes them as a GitHub Release named after the tag.
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/V_')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    # Windows .exe files are attached as-is. Linux/macOS binaries are zipped
    # after restoring the executable bit, which artifact downloads drop.
    - name: Package release assets
      run: |
        mkdir release
        for dir in artifacts/*/; do
          name=$(basename "$dir")
          if ls "$dir"*.exe >/dev/null 2>&1; then
            cp "$dir"*.exe release/
          else
            chmod +x "$dir"*
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          fi
        done
        ls -l release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        files: release/*
        generate_release_notes: true
